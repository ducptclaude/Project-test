<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Tài Chính Dự Án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: thanh điều hướng gradient Navy → Teal bên trái (trên điện thoại: dải trên cùng + thanh tab dưới cùng),
   nội dung nền sáng. Gradient chỉ dùng ở 3 chỗ: thanh điều hướng, thẻ lợi nhuận chính, nút hành động chính. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#EAF0F6; --ink:#0F1F3A; --muted:#5A6A82; --line:#E1E7EF;
  --navy:#16305C; --teal:#12A3A0;
  --accent:#16305C; --accent-ink:#FFFFFF; --accent-soft:#E3EEF9; --pro:#16305C;
  --rev:#12A3A0; --rev-ink:#0B7A78; --rev-soft:#DDF3EE;
  --exp:#E07B39; --exp-ink:#B4531A; --exp-soft:#FCEBDD;
  --warn:#8A5300; --warn-fill:#D08A12; --warn-soft:#FCF3E3;
  --bad:#B3261E; --bad-fill:#C2362C; --bad-soft:#FCECEA;
  --grad:linear-gradient(90deg,#16305C 0%,#1A5A80 55%,#12A3A0 100%);
  --grad-card:linear-gradient(135deg,#16305C 0%,#1B4F7C 55%,#12A3A0 100%);
  --grad-side:linear-gradient(180deg,#132B55 0%,#18406E 55%,#12807F 100%);
  --shadow:0 1px 2px rgba(15,31,58,.05);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1524; --surface:#132036; --sunk:#1A2A44; --ink:#E6EDF7; --muted:#9AABC4; --line:#24375A;
  --accent:#9DB8F0; --accent-ink:#0C1524; --accent-soft:#1E3157; --pro:#9DB8F0;
  --rev:#2BC0BC; --rev-ink:#4FD1CC; --rev-soft:#10393A;
  --exp:#F08C4A; --exp-ink:#F5A26B; --exp-soft:#3D2414;
  --warn:#E9B44C; --warn-fill:#E0A030; --warn-soft:#3A2C10;
  --bad:#F2766D; --bad-fill:#E5534A; --bad-soft:#3F1C1A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1524; --surface:#132036; --sunk:#1A2A44; --ink:#E6EDF7; --muted:#9AABC4; --line:#24375A;
  --accent:#9DB8F0; --accent-ink:#0C1524; --accent-soft:#1E3157; --pro:#9DB8F0;
  --rev:#2BC0BC; --rev-ink:#4FD1CC; --rev-soft:#10393A;
  --exp:#F08C4A; --exp-ink:#F5A26B; --exp-soft:#3D2414;
  --warn:#E9B44C; --warn-fill:#E0A030; --warn-soft:#3A2C10;
  --bad:#F2766D; --bad-fill:#E5534A; --bad-soft:#3F1C1A;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
h2{font-size:17px;font-weight:700;color:var(--accent)}
h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* khung */
/* --envh: chiều cao dải môi trường thử nghiệm (đặt bằng JS khi dải hiện), để khung vừa khít màn hình */
:root{--envh:0px}
.app{display:flex;min-height:calc(100vh - var(--envh))}
/* Thanh bên kéo hết chiều cao .app (nền phủ đến đáy dù trang ngắn hay dài); phần nội dung bên trong bám màn hình khi cuộn */
.side{flex:none;width:252px;align-self:stretch;position:relative;z-index:7;background:var(--grad-side);color:#FFFFFF}
.side-in{position:sticky;top:var(--envh);height:calc(100vh - var(--envh));display:flex;flex-direction:column;gap:28px;padding:26px 16px;background:var(--grad-side)}
.side-toggle{position:absolute;top:36px;right:-13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(15,31,58,.18);padding:0}
.side-toggle:hover{color:var(--teal)}
/* Thanh bên thu gọn: chỉ còn biểu tượng (máy tính, máy tính bảng); trên điện thoại dùng thanh tab */
@media (min-width:761px){
  .app.slim .side{width:76px}
  .app.slim .side-in{padding-inline:12px}
  .app.slim .side-title,.app.slim .nav .lbl,.app.slim .userbtn .who{display:none}
  .app.slim .side-brand{justify-content:center;padding:0}
  .app.slim .nav{justify-content:center;padding-inline:0}
  .app.slim .userbtn{justify-content:center;padding-inline:0;background:transparent}
  .app.slim .userbtn:hover{background:rgba(255,255,255,.12)}
  .app.slim .side-toggle svg{transform:rotate(180deg)}
  .app.slim .menu{right:auto;width:230px}
}
.side-brand{display:flex;align-items:center;gap:12px;padding:0 6px;min-width:0}
.logo{flex:none;height:44px;min-width:44px;padding:6px;border-radius:12px;background:#FFFFFF;display:grid;place-items:center}
.logo img{max-height:32px;max-width:120px;display:block}
.side-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.side-title b{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.side-title small{font-size:11.5px;color:rgba(255,255,255,.75)}
.side-nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:rgba(255,255,255,.82);padding:11px 14px;border-radius:10px;font-weight:600;font-size:14px;min-height:44px;cursor:pointer;text-align:left}
.nav:hover{background:rgba(255,255,255,.10);color:#FFFFFF}
.nav[aria-current="page"]{background:rgba(255,255,255,.17);color:#FFFFFF}
.nav svg,.tb svg{flex:none}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding-block:26px 48px;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px))}
.content>*{width:100%;max-width:1320px}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px}
.titles{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.period{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;background:var(--sunk);border-radius:12px}
.period label{font-size:12px;font-weight:600;color:var(--muted)}
.period select{border:0;background:var(--surface);box-shadow:var(--shadow);font-weight:600;color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
select,input[type=text],input[type=date],input[type=search],input[type=password]{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:40px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(18,163,160,.18)}
.inline{display:flex;align-items:center;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:0 16px;border-radius:10px;cursor:pointer;font-weight:700;min-height:42px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{border:0;color:#FFFFFF;background:var(--grad);box-shadow:0 8px 18px rgba(18,120,150,.22)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad-fill);border-color:var(--bad-fill);color:#FFFFFF}
.btn.sm{padding:0 10px;min-height:32px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}
.link-btn:hover{text-decoration:underline}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:13px}

/* thẻ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.row>.grow{flex:999 1 520px}
.row>.side-col{flex:1 1 300px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* chỉ số */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{border:0;color:#FFFFFF;background:var(--grad-card);box-shadow:0 14px 30px rgba(22,48,92,.25)}
.kpi.hero .lab,.kpi.hero .sub{color:rgba(255,255,255,.85)}
.kpi.hero .val{font-size:34px}
.kpi.hero .chip{background:rgba(255,255,255,.18);color:#FFFFFF}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.c-rev{color:var(--rev-ink)} .c-exp{color:var(--exp-ink)} .c-pro{color:var(--pro)} .c-bad{color:var(--bad)} .c-ok{color:var(--rev-ink)}
.bg-rev{background:var(--rev)} .bg-exp{background:var(--exp)} .bg-pro{background:var(--pro)}

/* nhãn trạng thái */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.active{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--rev-soft);color:var(--rev-ink)}
.chip.paused{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.code{background:var(--surface);border:1px solid var(--line);color:var(--accent)}
.chip.in{background:var(--rev-soft);color:var(--rev-ink)}
.chip.out{background:var(--exp-soft);color:var(--exp-ink)}

/* cảnh báo */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;padding:14px;border-radius:12px;border:0;text-align:left;cursor:pointer;width:100%;background:var(--bad-soft)}
.alert.warn{background:var(--warn-soft)}
.alert::before{content:"";width:4px;border-radius:2px;background:var(--bad-fill);flex:none}
.alert.warn::before{background:var(--warn-fill)}
.alert:hover{filter:brightness(.98)}
.alert .a-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.alert .a-tag{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--bad)}
.alert.warn .a-tag{color:var(--warn)}
.alert .a-title{font-size:14px;font-weight:700;color:var(--ink)}
.alert .a-detail{font-size:12.5px;color:var(--muted)}
.all-good{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:var(--rev-soft);color:var(--rev-ink);font-weight:600}

/* bảng */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover{background:var(--sunk)}
.pname{font-weight:700;color:var(--accent)}
.psub{font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:80px}
.meter>i{display:block;height:100%;border-radius:4px;background:var(--grad)}
.meter.warn>i{background:var(--warn-fill)} .meter.bad>i{background:var(--bad-fill)} .meter.rev>i{background:var(--rev)} .meter.exp>i{background:var(--exp)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.title-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sample-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 6px 5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sample-badge button{border:0;background:var(--surface);color:var(--bad);font:inherit;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;cursor:pointer}
.sample-badge button.armed{background:var(--bad-fill);color:#FFFFFF}
.presets{display:flex;gap:2px;padding:4px;background:var(--sunk);border-radius:12px;max-width:100%;overflow-x:auto}
.pp{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:0 12px;min-height:36px;border-radius:9px;cursor:pointer;white-space:nowrap}
.pp:hover{color:var(--ink)}
.pp[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow),0 1px 3px rgba(15,31,58,.10)}
.btn.tin{color:var(--rev-ink);border-color:color-mix(in srgb,var(--rev) 45%,var(--line))}
.btn.tout{color:var(--exp-ink);border-color:color-mix(in srgb,var(--exp) 45%,var(--line))}
.btn.tin:hover{background:var(--rev-soft)} .btn.tout:hover{background:var(--exp-soft)}
.kpi .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;min-height:36px}
.kpi .foot .sub{font-size:12px}
.spark{flex:none;display:block}
.delta{font-weight:700;white-space:nowrap}
.delta.good{color:var(--rev-ink)} .delta.bad{color:var(--bad)} .delta.flat{color:var(--muted)}
.kpi.hero .delta{color:#FFFFFF}
.seg-mini{display:flex;gap:2px;padding:3px;background:var(--sunk);border-radius:9px}
.seg-mini button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer}
.seg-mini button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(15,31,58,.12)}
.ph-tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pbars{display:flex;flex-direction:column;gap:12px}
.pbar{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) 84px;gap:12px;align-items:center;font-size:13px;border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;color:inherit;width:100%}
.pbar:hover .pb-name{color:var(--teal)}
.pb-name{font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-name small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.pb-track{position:relative;height:16px;border-radius:4px;background:var(--sunk)}
.pb-track .zero{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);opacity:.45}
.pb-track .fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--grad)}
.pb-track .fill.neg{background:var(--bad-fill)}
.pb-val{text-align:right;font-weight:800;white-space:nowrap}
.pbar.total{cursor:default;padding-top:10px;border-top:2px solid var(--line)}
.pbar.total .pb-name{color:var(--ink)}
.ledger{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:20px;align-items:start}
.ledger.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.ledger{grid-template-columns:minmax(0,1fr)}}
.big-total{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.e-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.e-dot.in{background:var(--rev)} .e-dot.out{background:var(--exp)}
.fab-menu{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 36px rgba(8,22,50,.25);min-width:220px}
.fab-menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;font:inherit;font-weight:700;font-size:15px;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--ink);min-height:48px}
.fab-menu button:hover{background:var(--sunk)}
.entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.entry-grid{grid-template-columns:minmax(0,1fr)}}
.entry .e-head{display:flex;align-items:center;gap:12px}
.entry .e-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.entry.in .e-icon{background:var(--rev-soft);color:var(--rev-ink)}
.entry.out .e-icon{background:var(--exp-soft);color:var(--exp-ink)}
.entry .e-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.entry .form input,.entry .form select{width:100%}
.amount-wrap{position:relative}
.amount-wrap input{font-size:20px;font-weight:800;min-height:52px;padding-right:58px}
.amount-wrap .unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.qcats{display:flex;flex-wrap:wrap;gap:6px}
.qcat{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:30px}
.qcat:hover{border-color:var(--muted);color:var(--ink)}
.qcat[aria-pressed="true"]{border-color:transparent}
.entry.in .qcat[aria-pressed="true"]{background:var(--rev-soft);color:var(--rev-ink)}
.entry.out .qcat[aria-pressed="true"]{background:var(--exp-soft);color:var(--exp-ink)}
.entry .err{margin:-6px 0 0}
.entry .err:empty{display:none}
.entry .save{width:100%;min-height:48px;font-size:15px}
.entry.out .save{background:linear-gradient(90deg,#16305C 0%,#8A4A2A 60%,#E07B39 100%)}
.type-lock{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:40px}
.type-lock small{font-size:12px;color:var(--muted)}
.today{font-size:13px;color:var(--muted)}
.today b{color:var(--ink)}
.txp{display:block;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat>span:first-child{min-width:0}
.cat .ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}

/* danh sách dạng thẻ cho điện thoại */
.cards{display:none;flex-direction:column;gap:10px}
.pcard{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer;width:100%}
.pcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.pcard.total{cursor:default;background:var(--sunk);border-color:transparent}
.pcard.total .line b{color:var(--ink)}
.cnote{min-width:120px;max-width:280px;overflow-wrap:anywhere}
.ctbl th,.ctbl td{padding-inline:10px}
/* Khối hợp đồng: khung hẹp hơn bảng (máy tính nhỏ, thanh bên mở) thì chuyển sang dạng thẻ xếp lưới */
.cpanel{container-type:inline-size}
@container (max-width:760px){.cpanel .desk{display:none}.cpanel .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.pcard .actions{justify-content:flex-start}
.txlist{list-style:none;margin:0;padding:0;display:none;flex-direction:column}
.txlist li{border-bottom:1px solid var(--line)}
.txlist li:last-child{border-bottom:0}
.txrow{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;width:100%;border:0;background:none;text-align:left}
button.txrow{cursor:pointer}
.txrow .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.txrow .l b{font-weight:700}
.txrow .amt{font-weight:800;white-space:nowrap}
.txlist li.txtotal{border-top:2px solid var(--line);border-bottom:0}
.txtotal .txrow{align-items:center}
.txtotal .amt small{display:block;text-align:right;font-size:11px;font-weight:600;color:var(--muted)}

/* biểu đồ */
.chart{position:relative;width:100%;min-height:280px}
.chart svg{display:block}
.chart text{font-family:var(--font);font-size:11px;font-weight:600;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.6;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip .num{display:inline-block;min-width:90px;text-align:right;font-weight:700}

/* cơ cấu thu chi */
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13.5px}
.cat>span:first-child{font-weight:600}
.cat .meter{height:10px;min-width:0}
.cat .v{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.cat .v small{color:var(--muted);font-weight:600;margin-left:6px}
.cat.total{padding-top:10px;border-top:2px solid var(--line)}
.cat.total>span:first-child,.cat.total .v{font-weight:800}

/* màn dự án */
.pv{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%}
.pitem:hover{border-color:var(--muted)}
.pitem[aria-current="true"]{border-color:transparent;box-shadow:0 0 0 2px var(--teal)}
.pitem .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.pitem .pname{font-size:13.5px;line-height:1.35}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start}
.phead h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.phead .meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted);margin-top:8px}
.phead .meta b{color:var(--ink);font-weight:600}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.plan .kpi .val{font-size:26px}
.plan .pair{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.plan .meter{height:10px}
.plan .split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;font-size:12.5px;color:rgba(255,255,255,.85)}
.plan .split b{display:block;color:#FFFFFF;font-weight:700}
.sec-title{font-size:15px;font-weight:700;color:var(--ink);margin-top:4px}

.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}

/* hộp thoại */
#dlg-code{width:min(460px,calc(100vw - 32px))}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 30px 70px rgba(8,22,50,.3)}
dialog::backdrop{background:rgba(10,20,40,.5)}
dialog.wide{width:min(880px,calc(100vw - 32px))}
.dlg{display:flex;flex-direction:column;gap:16px;padding:24px}
.dlg h2{font-size:20px;font-weight:800}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.form input,.form select{width:100%}
.seg{position:relative;display:flex;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;min-height:40px}
.seg label{flex:1;display:grid;place-items:center;cursor:pointer;font-weight:700;color:var(--muted)}
/* Ô radio ẩn phải nằm gọn trong .seg: trước đây nó nhận width:100% của .form input và định vị theo hộp thoại, gây thanh cuộn ngang */
.seg input[type=radio]{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.seg input:checked+label.in{background:var(--rev-soft);color:var(--rev-ink)}
.seg input:checked+label.out{background:var(--exp-soft);color:var(--exp-ink)}
.seg input:focus-visible+label{outline:2px solid var(--teal);outline-offset:-2px}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.dlg-foot .inline{margin-left:auto}
.err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:1em}
.ro{display:flex;flex-direction:column;gap:2px;min-height:40px;justify-content:center;font-size:13.5px}
.ro small{font-size:11.5px;color:var(--muted)}
.secret{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--rev-soft);border-radius:10px;padding:12px 14px;font-size:13px}
.secret code{font-size:15px;font-weight:700;background:var(--surface);padding:3px 8px;border-radius:6px;user-select:all}

.envbar{position:relative;z-index:6;background:repeating-linear-gradient(-45deg,#A86A10 0 14px,#8a560c 14px 28px);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* máy tính: dải môi trường luôn ở trên cùng khi cuộn, thanh bên bám ngay dưới dải (xem --envh) */
@media (min-width:761px){.envbar{position:sticky;top:0}}

/* tài khoản */
.userbox{position:relative;margin-top:auto}
.userbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:rgba(255,255,255,.10);color:#FFFFFF;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:44px;text-align:left}
.userbtn:hover{background:rgba(255,255,255,.16)}
.avatar{width:36px;height:36px;border-radius:50%;background:#FFFFFF;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.userbtn .who{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.userbtn .who b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn .who small{color:rgba(255,255,255,.75);font-size:11.5px}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(8,22,50,.22);padding:6px;z-index:5;display:flex;flex-direction:column;min-width:220px}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;min-height:40px}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* thanh tab dưới cùng (điện thoại) */
.tabbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:1100px){.pv{grid-template-columns:minmax(0,1fr)}.plist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.plist .pitem{min-width:210px}}
@media (max-width:760px){
  .app{flex-direction:column}
  .app{min-height:100vh}
  .side{width:auto}
  .side-in{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side-nav,.side-toggle{display:none}
  .userbox{margin-top:0}
  .userbtn{padding:4px;background:transparent;width:auto}
  .userbtn .who{display:none}
  .menu{left:auto;right:0;bottom:auto;top:calc(100% + 6px)}
  .content{padding-top:18px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));gap:16px}
  h1{font-size:22px}
  .controls{width:100%}
  .period{flex:1}
  .period select{flex:1;min-width:0}
  #btn-new-in,#btn-new-out{display:none}
  .presets{flex:1 1 100%}
  .pp{flex:1;padding:0 8px;font-size:12.5px}
  .period{flex:1 1 100%}
  .pbar{grid-template-columns:minmax(64px,96px) minmax(0,1fr) 72px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpis .kpi.hero,.kpis .kpi.wide-m{grid-column:1/-1}
  .kpi .foot{flex-wrap:wrap}
  .kpi{padding:16px}
  .kpi .val{font-size:22px}
  .kpi.hero .val{font-size:30px}
  .panel{padding:16px}
  .desk{display:none}
  .cards,.txlist{display:flex}
  .cat{grid-template-columns:minmax(0,1fr) 110px}
  .cat .meter{grid-column:1/-1;grid-row:2}
  .cat .gap{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:11px;font-weight:700;color:var(--muted);min-height:50px;cursor:pointer}
  .tb[aria-current="page"]{color:var(--accent)}
  .tb-new{flex:none;width:58px;height:58px;margin:-24px 6px 0;border-radius:50%;border:0;color:#FFFFFF;background:var(--grad-card);box-shadow:0 10px 22px rgba(18,120,150,.35);display:grid;place-items:center;cursor:pointer}
  .tb-new:disabled{opacity:.5}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.nav,.btn,.pitem,.pcard,.tb{transition:background .15s,border-color .15s,box-shadow .15s,color .15s}.side{transition:width .2s ease}.side-in{transition:padding .2s ease}.side-toggle svg{transition:transform .2s}}
</style>
</head>
<body>

<div id="envbar" class="envbar" hidden></div>
<div class="app">
  <aside class="side"><div class="side-in">
    <button class="side-toggle" id="side-toggle" aria-label="Thu gọn thanh bên" aria-expanded="true" title="Thu gọn thanh bên"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="side-brand">
      <span class="logo" id="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16305C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11"/><path d="M10 20V5"/><path d="M16 20v-6"/><path d="M21 20H3"/><path d="M4 8l6-4 6 6 5-4"/></svg></span>
      <span class="side-title"><b id="b-name">Sổ Tài Chính Dự Án</b><small id="b-org">Quản lý tài chính dự án</small></span>
    </div>
    <nav class="side-nav" aria-label="Điều hướng chính">
      <button class="nav" data-view="overview" title="Tổng quan"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="lbl">Tổng quan</span></button>
      <button class="nav" data-view="project" title="Dự án"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg><span class="lbl">Dự án</span></button>
      <button class="nav" data-view="revenue" title="Doanh thu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg><span class="lbl">Doanh thu</span></button>
      <button class="nav" data-view="expense" title="Chi phí"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7L7 17"/><path d="M16 17H7V8"/></svg><span class="lbl">Chi phí</span></button>
      <button class="nav" data-view="journal" title="Sổ giao dịch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 9v11"/></svg><span class="lbl">Sổ giao dịch</span></button>
    </nav>
    <div class="userbox" id="userbox" hidden>
      <button class="userbtn" id="userbtn" aria-haspopup="menu" aria-expanded="false"><span class="avatar" id="u-avatar"></span><span class="who"><b id="u-name"></b><small id="u-role"></small></span></button>
      <div class="menu" id="usermenu" role="menu" hidden>
        <button role="menuitem" id="m-password">Đổi mật khẩu</button>
        <button role="menuitem" id="m-users" hidden>Quản lý tài khoản</button>
        <hr>
        <button role="menuitem" id="m-logout">Đăng xuất</button>
      </div>
    </div>
  </div></aside>

  <div class="content">
    <header class="page-head">
      <div class="titles"><span class="eyebrow" id="ph-eyebrow"></span><div class="title-row"><h1 id="ph-title">Tổng quan tài chính</h1><span id="ph-badge"></span></div></div>
      <div class="controls">
        <div class="presets" role="group" aria-label="Kỳ báo cáo">
          <button class="pp" data-preset="month">Tháng này</button><button class="pp" data-preset="quarter">Quý này</button><button class="pp" data-preset="year">Năm nay</button><button class="pp" data-preset="all">Tất cả</button><button class="pp" data-preset="custom">Tùy chọn</button>
        </div>
        <div class="seg-mini" role="group" aria-label="Giá trị hợp đồng hiện theo" title="Giá trị hợp đồng hiện theo trước hay sau VAT"><button data-vat="pre">Trước VAT</button><button data-vat="post">Sau VAT</button></div>
        <div class="period" id="custom-period" hidden><label for="f-year">Năm</label><select id="f-year"></select><label for="f-period">Kỳ</label><select id="f-period"></select></div>

        <button class="btn tout" id="btn-new-out">+ Chi</button>
      </div>
    </header>
    <main id="main"><div class="panel empty">Đang tải dữ liệu…</div></main>

</div>

<nav class="tabbar" aria-label="Điều hướng nhanh">
  <button class="tb" data-view="overview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tổng quan</button>
  <button class="tb" data-view="project"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg>Dự án</button>

</nav>

<div class="fab-menu" id="fab-menu" hidden>
  <button data-fab="revenue"><span class="e-dot in"></span>Ghi doanh thu</button>
  <button data-fab="expense"><span class="e-dot out"></span>Ghi chi phí</button>

<dialog id="dlg"><form class="dlg" id="dlg-form" novalidate></form></dialog>

<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd = v => Math.round(v || 0).toLocaleString('vi-VN') + ' ₫';
// Báo cáo tổng (thẻ chỉ số, biểu đồ, bảng tổng hợp, cảnh báo) luôn hiện theo tỷ đồng: 9,25 tỷ · 0,189 tỷ
const short = (v, digits) => ((v || 0) / 1e9).toLocaleString('vi-VN', {maximumFractionDigits: digits ?? (Math.abs(v || 0) >= 1e9 ? 2 : 3)}) + ' tỷ';
// Cách đọc số tiền đang gõ trong ô nhập (gợi ý cạnh ô, không phải báo cáo): 12,5 tr · 1,2 tỷ
const spoken = v => {
  const a = Math.abs(v || 0), f = (x, d) => x.toLocaleString('vi-VN', {maximumFractionDigits: d});
  if (a >= 1e9) return f(v / 1e9, 2) + ' tỷ';
  if (a >= 1e6) return f(v / 1e6, 1) + ' tr';
  if (a >= 1e3) return f(v / 1e3, 0) + ' nghìn';
  return f(v || 0, 0);
};
const pct = v => isFinite(v) ? (v * 100).toLocaleString('vi-VN', {maximumFractionDigits: 1}) + '%' : '—';
const parseMoney = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const today = () => new Date().toISOString().slice(0, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem('stc:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('stc:' + k, JSON.stringify(v)); } catch {} }
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
}
function armButton(btn, label, action) {
  // two-step confirmation: first click arms, second click acts
  if (btn.classList.contains('armed')) { action(); return; }
  const orig = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = orig; } }, 3500);
}

const STATUS = {active: 'Đang thực hiện', paused: 'Tạm dừng', done: 'Hoàn thành'};
const CATS = {
  in: ['Tạm ứng hợp đồng', 'Thanh toán theo nghiệm thu', 'Quyết toán', 'Phát sinh ngoài hợp đồng', 'Dịch vụ / bảo trì', 'Thu khác'],
  out: ['Nhân công', 'Vật tư', 'Thiết bị / máy móc', 'Thầu phụ', 'Vận chuyển', 'Bản quyền / phần mềm', 'Chi phí quản lý', 'Thuế & phí', 'Chi khác']
};
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

/* ---------- state ---------- */
const S = {

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function retry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i < 3 && (e?.code === 'unavailable' || e?.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 400 * (i + 1) + Math.random() * 300)); continue; }
      throw e;
    }
  }
}
function failMsg(e) {
  if (e?.message) return e.message;
  if (e?.code === 'quota_exceeded') return 'Cơ sở dữ liệu đã đầy. Hãy xóa bớt giao dịch cũ rồi thử lại.';
  if (e?.code === 'invalid_argument') return 'Dữ liệu không hợp lệ, chưa lưu được.';
  return 'Chưa lưu được. Kiểm tra kết nối rồi thử lại.';
}
async function api(method, path, body, background = false) {
  const headers = {'X-Requested-With': 'fetch'}; if (body) headers['Content-Type'] = 'application/json';
  if (background) headers['X-Background'] = '1'; else lastPing = Date.now();
  const r = await fetch('api/' + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { location.replace('login#het-phien'); throw {code: 'unauthenticated', message: 'Phiên đăng nhập đã hết hạn.'}; }
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw {code: r.status === 413 ? 'quota_exceeded' : r.status >= 500 ? 'unavailable' : r.status === 403 ? 'forbidden' : 'invalid_argument', message: d.error};
  }
  return r.status === 204 || r.status === 201 ? null : r.json();
}
async function put(col, id, data) {
  const saved = await retry(() => api('PUT', col + '/' + encodeURIComponent(id), data));   // giao dịch: máy chủ trả bản ghi đã lưu (kèm người nhập)
  const list = col === 'projects' ? S.projects : S.txs, i = list.findIndex(x => x.id === id), rec = saved || {id, ...data};
  if (i >= 0) list[i] = rec; else list.push(rec);
  refresh();
}
async function del(col, id, passcode) {
  await retry(() => api('DELETE', col + '/' + encodeURIComponent(id), {passcode}));
  if (col === 'projects') S.projects = S.projects.filter(x => x.id !== id); else S.txs = S.txs.filter(x => x.id !== id);
  refresh();
}

/* ---------- derived numbers ---------- */
function range() {
  if (S.year === 'all') return [null, null];
  const y = S.year, p = S.period;
  if (p === 'all') return [`${y}-01-01`, `${y}-12-31`];
  if (p[0] === 'q') { const q = +p[1], a = (q - 1) * 3 + 1, b = a + 2; return [`${y}-${String(a).padStart(2,'0')}-01`, `${y}-${String(b).padStart(2,'0')}-31`]; }
  const m = p.slice(1); return [`${y}-${m}-01`, `${y}-${m}-31`];
}
function periodLabel() {
  if (S.year === 'all') return 'Toàn thời gian';
  if (S.period === 'all') return 'Năm ' + S.year;
  if (S.period[0] === 'q') return `Quý ${S.period[1]}/${S.year}`;
  return `Tháng ${+S.period.slice(1)}/${S.year}`;
}
const inRange = t => { const [a, b] = range(); return (!a || t.date >= a) && (!b || t.date <= b); };
function sum(txs) {
  let rev = 0, exp = 0; const cat = {in: {}, out: {}};
  for (const t of txs) {
    const a = +t.amount || 0;
    if (t.type === 'in') rev += a; else exp += a;
    cat[t.type][t.category || 'Khác'] = (cat[t.type][t.category || 'Khác'] || 0) + a;
  }
  return {rev, exp, profit: rev - exp, margin: rev ? (rev - exp) / rev : NaN, cat};
}
function monthly(txs) {
  let [a, b] = range();
  if (!a) {
    if (!txs.length) return [];
    const ds = txs.map(t => t.date).sort(); a = ds[0]; b = ds[ds.length - 1];
  }
  const out = [], idx = {};
  let [y, m] = a.slice(0, 7).split('-').map(Number); let end = b.slice(0, 7);
  const lastTx = txs.reduce((mx, t) => t.date > mx ? t.date : mx, '').slice(0, 7), now = today().slice(0, 7);
  if (end > now) end = lastTx > now ? lastTx : now;
  while (true) {
    const k = `${y}-${String(m).padStart(2, '0')}`; if (k > end) break;
    idx[k] = out.length; out.push({m: k, rev: 0, exp: 0, profit: 0});
    if (++m > 12) { m = 1; y++; }
  }
  for (const t of txs) { const o = out[idx[t.date.slice(0, 7)]]; if (!o) continue; if (t.type === 'in') o.rev += +t.amount; else o.exp += +t.amount; }
  out.forEach(o => o.profit = o.rev - o.exp);
  return out;
}
const projTxs = id => S.txs.filter(t => t.projectId === id);
/* ---------- hợp đồng với CĐT ---------- */
// Giá trị hợp đồng của dự án tính từ bảng hợp đồng; dự án chưa có dòng nào thì dùng contractValue cũ.
// pre: trước VAT · vat: tổng VAT đã nhập · post: sau VAT · provisional: số dòng VAT tạm tính (chưa nhập, coi là 0)
const projContracts = id => S.contracts.filter(c => c.projectId === id).sort((a, b) => (a.seq || 0) - (b.seq || 0));
function contractTotals(id) {
  const list = projContracts(id);
  if (!list.length) { const v = +S.projects.find(p => p.id === id)?.contractValue || 0; return {pre: v, vat: 0, post: v, provisional: v ? 1 : 0, count: 0}; }
  let pre = 0, vat = 0, provisional = 0;
  for (const c of list) { pre += +c.value || 0; if (c.vat == null) provisional++; else vat += +c.vat || 0; }
  return {pre, vat, post: pre + vat, provisional, count: list.length};
}
const cvPre = p => contractTotals(p.id).pre;     // lợi nhuận kế hoạch, dự báo: theo trước VAT
const cvPost = p => contractTotals(p.id).post;   // đã thu / còn phải thu: theo sau VAT (tiền thu theo quyết toán là sau VAT)
// Nút Trước VAT | Sau VAT chỉ đổi các chỗ hiện giá trị hợp đồng thuần (tổng giá trị HĐ); mọi phép so Đã thu / Còn phải thu luôn dùng sau VAT
const vatWord = () => S.vatMode === 'post' ? 'sau VAT' : 'trước VAT';
// Số tiền đầy đủ theo đồng, giữ dấu âm (phụ lục giảm)
const dong = v => (v < 0 ? '−' : '') + Math.abs(Math.round(v || 0)).toLocaleString('vi-VN');
function health(p) {
  const all = sum(projTxs(p.id)), used = p.budget ? all.exp / p.budget : 0, flags = [];
  if (all.profit < 0 && all.exp > 0) flags.push(['bad', 'Đang lỗ']);
  if (used > 1) flags.push(['bad', 'Vượt ngân sách']); else if (used > 0.9) flags.push(['warn', 'Gần chạm ngân sách']);
  return {all, used, flags};
}
const meterCls = u => u > 1 ? 'bad' : u > 0.9 ? 'warn' : '';

/* ---------- chọn kỳ ---------- */
function nowParts() { const d = new Date(); return {y: String(d.getFullYear()), m: d.getMonth() + 1}; }
function presetOf() {
  const {y, m} = nowParts();
  if (S.year === 'all') return 'all';
  if (S.year !== y) return 'custom';
  if (S.period === 'all') return 'year';
  if (S.period === 'q' + Math.ceil(m / 3)) return 'quarter';
  if (S.period === 'm' + String(m).padStart(2, '0')) return 'month';
  return 'custom';
}
function applyPreset(p) {
  const {y, m} = nowParts();
  S.custom = p === 'custom';
  if (p === 'all') S.year = 'all';
  if (p === 'year') { S.year = y; S.period = 'all'; }
  if (p === 'quarter') { S.year = y; S.period = 'q' + Math.ceil(m / 3); }
  if (p === 'month') { S.year = y; S.period = 'm' + String(m).padStart(2, '0'); }
  S.jpage = 0; store.set('year', S.year); store.set('period', S.period);
  render();
}
function renderFilters() {
  const ys = new Set([String(new Date().getFullYear())]); S.txs.forEach(t => ys.add(t.date.slice(0, 4)));
  if (S.year !== 'all') ys.add(S.year);
  $('#f-year').innerHTML = `<option value="all">Tất cả</option>` + [...ys].sort().reverse().map(y => `<option value="${y}">${y}</option>`).join('');
  $('#f-year').value = S.year;
  const ps = [['all', 'Cả năm'], ['q1', 'Quý 1'], ['q2', 'Quý 2'], ['q3', 'Quý 3'], ['q4', 'Quý 4'], ...MONTHS.map((m, i) => ['m' + String(i + 1).padStart(2, '0'), 'Tháng ' + (i + 1)])];
  $('#f-period').innerHTML = ps.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('#f-period').value = S.period; $('#f-period').disabled = S.year === 'all';
  const cur = S.custom ? 'custom' : presetOf();
  document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === cur)));
  $('#custom-period').hidden = cur !== 'custom';
}
// Kỳ liền trước kỳ đang xem, để so sánh: năm trước, quý trước, tháng trước
function prevPeriod() {
  if (S.year === 'all') return null;
  const y = +S.year, p = S.period, pad = n => String(n).padStart(2, '0');
  if (p === 'all') return {range: [`${y - 1}-01-01`, `${y - 1}-12-31`], label: 'năm ' + (y - 1)};
  if (p[0] === 'q') { let q = +p[1] - 1, yy = y; if (!q) { q = 4; yy--; } const a = (q - 1) * 3 + 1; return {range: [`${yy}-${pad(a)}-01`, `${yy}-${pad(a + 2)}-31`], label: `quý ${q}/${yy}`}; }
  let m = +p.slice(1) - 1, yy = y; if (!m) { m = 12; yy--; }
  return {range: [`${yy}-${pad(m)}-01`, `${yy}-${pad(m)}-31`], label: `tháng ${m}/${yy}`};
}
const within = ([a, b]) => t => t.date >= a && t.date <= b;

/* ---------- thẻ chỉ số ---------- */
const money = (v, cls = '') => `<span class="num ${cls}" title="${vnd(v)}">${short(v)}</span>`;
function kpi(label, value, sub, {dot = '', cls = '', hero = false, title = '', foot = '', wide = false} = {}) {
  return `<div class="kpi${hero ? ' hero' : ''}${wide ? ' wide-m' : ''}"><span class="lab">${dot ? `<i class="dot ${dot}"></i>` : ''}${label}</span>
    <span class="val num ${cls}"${title ? ` title="${title}"` : ''}>${value}</span><span class="sub">${sub}</span>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}
// Thay đổi so với kỳ trước; goodUp=false cho chi phí (tăng là xấu)
function delta(cur, prev, label, goodUp = true) {
  if (!prev) return `<span class="sub">Kỳ trước (${label}) chưa có số liệu</span>`;
  const r = (cur - prev) / Math.abs(prev), up = cur >= prev, flat = Math.abs(r) < 0.005;
  const cls = flat ? 'flat' : (up === goodUp ? 'good' : 'bad');
  // Kỳ trước hoặc kỳ này âm: % khi đổi dấu không có ý nghĩa nên hiện chênh lệch tuyệt đối; còn lại luôn hiện %
  const txt = prev < 0 || cur < 0 ? `${up ? '+' : '−'}${short(Math.abs(cur - prev))}` : pct(Math.abs(r));
  return `<span class="sub"><span class="delta ${cls}">${flat ? '■' : up ? '▲' : '▼'} ${txt}</span> so với ${label}</span>`;
}
// Đường xu hướng 12 tháng gần nhất (tính đến cuối kỳ đang xem)
function last12(fn) {
  const end = (range()[1] || today()).slice(0, 7) > today().slice(0, 7) ? today().slice(0, 7) : (range()[1] || today()).slice(0, 7);
  let [y, m] = end.split('-').map(Number); const ms = [];
  for (let i = 0; i < 12; i++) { ms.unshift(`${y}-${String(m).padStart(2, '0')}`); if (--m < 1) { m = 12; y--; } }
  const acc = Object.fromEntries(ms.map(k => [k, {rev: 0, exp: 0}]));
  for (const t of S.txs) { const o = acc[t.date.slice(0, 7)]; if (o) o[t.type === 'in' ? 'rev' : 'exp'] += +t.amount || 0; }
  return ms.map(k => fn(acc[k]));
}
function spark(vals, color, fill) {
  const W = 112, H = 36, lo = Math.min(0, ...vals), hi = Math.max(...vals, lo + 1);
  const x = i => 2 + i * (W - 6) / (vals.length - 1), y = v => 3 + (hi - v) / (hi - lo) * (H - 6);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals.length - 1;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <path d="M${x(0)},${y(lo === 0 ? 0 : lo)} L${pts.replace(/ /g, ' L')} L${x(last)},${y(lo === 0 ? 0 : lo)} Z" fill="${fill}"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(vals[last])}" r="3.5" fill="${color}"/></svg>`;
}

// Lợi nhuận theo dự án: thanh ngang hai phía quanh mốc 0, lãi màu gradient, lỗ màu đỏ
function profitPanel(rows) {

  const pos = Math.max(0, ...list.map(r => r.s.profit)), neg = Math.max(0, ...list.map(r => -r.s.profit)), span = (pos + neg) || 1, zero = neg / span * 100;

      const w = Math.abs(s.profit) / span * 100, left = s.profit >= 0 ? zero : zero - w;
      return `<button class="pbar" data-open="${esc(p.id)}" title="${esc(p.name)}: ${vnd(s.profit)}"><span class="pb-name"><span class="num">${esc(p.code)}</span><small>${esc(p.name)}</small></span>

    }).join('')}${(() => { const t = list.reduce((a, r) => a + r.s.profit, 0);
      return `<div class="pbar total" title="Tổng cộng: ${vnd(t)}"><span class="pb-name">Tổng cộng</span><span></span><span class="pb-val num ${t < 0 ? 'c-bad' : ''}">${short(t)}</span></div>`; })()}</div>` : '<p class="muted" style="margin:0">Chưa có giao dịch trong kỳ này.</p>'}
  </section>`;
}

const flagChips = h => h.flags.map(([c, l]) => `<span class="chip ${c}">${l}</span>`).join('');
const marginCell = s => s.rev || s.exp ? (s.profit < 0 ? '<span class="chip bad">Lỗ</span>' : pct(s.margin)) : '—';

// Danh sách cảnh báo lấy từ health(): mỗi vấn đề của một dự án là một dòng, nặng xếp trước
function alerts() {
  const out = [];
  for (const p of sortedProjects()) {
    const h = health(p), cv = cvPost(p), bg = +p.budget || 0;
    if (h.all.profit < 0 && h.all.exp > 0) out.push({p, sev: 0, tag: 'ĐANG LỖ', detail: `Lỗ lũy kế ${short(-h.all.profit)}.${cv ? ` Mới thu ${pct(h.all.rev / cv)} giá trị hợp đồng (sau VAT).` : ''}`});
    if (h.used > 1) out.push({p, sev: 0, tag: 'VƯỢT NGÂN SÁCH', detail: `Đã chi ${pct(h.used)} ngân sách (vượt ${short(h.all.exp - bg)}).`});
    else if (h.used > 0.9) out.push({p, sev: 1, tag: 'SẮP HẾT NGÂN SÁCH', detail: `Đã dùng ${pct(h.used)} ngân sách, còn ${short(bg - h.all.exp)}.`});
  }
  return out.sort((a, b) => a.sev - b.sev);
}
function alertPanel(list) {
  return `<section class="panel side-col"><div class="panel-head"><h2>Cần chú ý</h2>${list.length ? `<span class="chip bad">${list.length}</span>` : ''}</div>
    ${list.length ? `<div class="alerts">${list.map(a => `<button class="alert${a.sev ? ' warn' : ''}" data-open="${esc(a.p.id)}"><span class="a-body">
      <span class="a-tag">${a.tag}</span><span class="a-title">${esc(a.p.code)} · ${esc(a.p.name)}</span><span class="a-detail">${a.detail}</span></span></button>`).join('')}</div>`
      : `<div class="all-good">Không có dự án nào đang lỗ hay vượt ngân sách.</div>`}
  </section>`;
}

// Khối Hợp đồng với CĐT ở Chi tiết dự án: bảng trên máy tính, thẻ trên điện thoại; số tiền đầy đủ theo đồng
function contractPanel(p) {
  const list = projContracts(p.id), t = contractTotals(p.id), hasBase = list.some(c => c.kind === 'base');
  const nApp = list.filter(c => c.kind === 'appendix').length;
  const label = c => c.kind === 'base' ? 'HĐ gốc' : `Phụ lục ${c.seq}`;
  const vatCell = c => c.vat == null ? '<span class="chip warn" title="Chưa nhập VAT, tạm coi là 0">Tạm tính</span>' : dong(c.vat);
  const lastEdit = c => c.updatedAt ? `Sửa lần cuối: ${c.updatedByName || '—'} · ${new Date(c.updatedAt).toLocaleString('vi-VN')}` : '';
  const delBtn = c => c.kind === 'base' && nApp
    ? `<button class="btn sm danger" disabled title="Xóa các phụ lục trước khi xóa hợp đồng gốc">Xóa</button>`
    : `<button class="btn sm danger" data-act="del-contract" data-id="${esc(c.id)}">Xóa</button>`;
  const acts = c => S.canWrite ? `<div class="actions"><button class="btn sm" data-act="edit-contract" data-id="${esc(c.id)}">Sửa</button>${delBtn(c)}</div>` : '';
  const add = !S.canWrite ? '' : hasBase ? `<button class="btn sm" data-act="new-contract" data-kind="appendix" data-id="${esc(p.id)}">+ Phụ lục</button>`
    : `<button class="btn sm primary" data-act="new-contract" data-kind="base" data-id="${esc(p.id)}">+ HĐ gốc</button>`;

  return `<section class="panel cpanel">${head}
    <div class="tbl-wrap desk"><table class="ctbl">
      <thead><tr><th>Hợp đồng</th><th class="r">Trước VAT (₫)</th><th class="r">VAT (₫)</th><th class="r">Sau VAT (₫)</th><th>Ghi chú</th>${S.canWrite ? '<th></th>' : ''}</tr></thead>
      <tbody>${list.map(c => `<tr>
        <td><div style="font-weight:700;white-space:nowrap">${label(c)}</div><div class="psub num">${esc(c.no) || 'Chưa có số'}</div><div class="psub num">${c.signDate ? 'Ký ' + fmtDate(c.signDate) : 'Chưa có ngày ký'}</div></td>
        <td class="r num ${c.value < 0 ? 'c-bad' : ''}" style="font-weight:700">${dong(c.value)}</td><td class="r num">${vatCell(c)}</td>
        <td class="r num" style="font-weight:800">${dong((+c.value || 0) + (+c.vat || 0))}</td>
        <td class="cnote">${c.note ? `<div style="font-size:13px">${esc(c.note)}</div>` : ''}<div class="psub" title="${esc(lastEdit(c))}">Nhập: ${esc(c.createdByName) || '—'}</div></td>${S.canWrite ? `<td>${acts(c)}</td>` : ''}
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>Tổng cộng ${provNote}</td><td class="r num">${dong(t.pre)}</td><td class="r num">${dong(t.vat)}</td><td class="r num">${dong(t.post)}</td><td colspan="${S.canWrite ? 2 : 1}"></td></tr></tfoot>
    </table></div>
    <div class="cards">${list.map(c => `<div class="pcard" style="cursor:default">
      <span class="top"><b>${label(c)}</b><span class="num psub">${esc(c.no)}${c.signDate ? ` · ${fmtDate(c.signDate)}` : ''}</span></span>

    </div>`).join('')}
      <div class="pcard total"><span class="pname" style="color:var(--ink)">Tổng cộng</span>${provNote ? `<span>${provNote}</span>` : ''}
        <span class="line"><span>Trước VAT</span><b class="num">${dong(t.pre)} ₫</b></span>
        <span class="line"><span>VAT</span><b class="num">${dong(t.vat)} ₫</b></span>
        <span class="line"><span>Sau VAT</span><b class="num">${dong(t.post)} ₫</b></span>

  </section>`;
}

// Các trường nhập một khoản thu/chi: dùng chung cho ô nhập ở trang Doanh thu/Chi phí và hộp Ghi / Sửa giao dịch,

function txFields(px, t, typeCtl = 'none') {

async function saveEntry(f) {
  const type = f.dataset.entry, v = k => $(`#e-${type}-${k}`).value.trim(), err = $(`#e-${type}-err`);
  const data = {projectId: v('project'), type, date: v('date'), category: v('cat') || 'Khác', amount: parseMoney(v('amount')), note: v('note')};
  if (!data.amount) { err.textContent = 'Nhập số tiền lớn hơn 0.'; $(`#e-${type}-amount`).focus(); return; }
  if (!data.date) { err.textContent = 'Chọn ngày phát sinh.'; return; }
  err.textContent = '';
  const btn = f.querySelector('.save'); btn.disabled = true;
  try {
    await put('transactions', uid(), data);
    S.entry[type] = {projectId: data.projectId, date: data.date};
    ['amount', 'note', 'cat'].forEach(k => $(`#e-${type}-${k}`).value = '');
    f.querySelector(`[data-hint="e-${type}-amount"]`).textContent = '';
    f.querySelectorAll('.qcat').forEach(b => b.setAttribute('aria-pressed', 'false'));
    const p = S.projects.find(x => x.id === data.projectId);
    toast(`Đã ghi khoản ${ENTRY[type].word} ${vnd(data.amount)} · ${p ? p.code : ''}${inRange(data) ? '' : ' (ngoài kỳ đang xem)'}`);
    $(`#e-${type}-amount`).focus();
  } catch (er) { err.textContent = failMsg(er); }
  finally { btn.disabled = false; }
}

  const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const shown = sorted.slice(offset, offset + limit), st = sum(txs);
  const code = t => esc(S.projects.find(p => p.id === t.projectId)?.code || '');
  const amt = t => `${t.type === 'in' ? '+' : '−'}${Math.round(t.amount).toLocaleString('vi-VN')}`;
  // Người nhập (máy chủ ghi); giao dịch cũ chưa có thì để trống. Rê chuột: người sửa lần cuối
  const edited = t => t.updatedByName && t.updatedAt ? `Sửa lần cuối: ${t.updatedByName} · ${new Date(t.updatedAt).toLocaleString('vi-VN')}` : '';
  const by = t => t.createdByName ? `<div class="psub" style="font-size:11.5px" title="${esc(edited(t))}">Nhập: ${esc(t.createdByName)}</div>` : '';
  const total = `${st.profit < 0 ? '−' : ''}${Math.abs(Math.round(st.profit)).toLocaleString('vi-VN')}`;
  return `<div class="tbl-wrap desk"><table>
    <thead><tr><th>Ngày</th>${showProject ? '<th>Dự án</th>' : ''}${compact ? '' : '<th>Loại</th>'}<th>Hạng mục</th><th>Diễn giải</th><th class="r">Số tiền (₫)</th>${S.canWrite ? '<th></th>' : ''}</tr></thead>
    <tbody>${shown.map(t => `<tr>
      <td class="num muted" style="white-space:nowrap">${fmtDate(t.date)}</td>
      ${showProject ? `<td><span class="txp" title="${esc(projectName(t.projectId))}"><span class="num" style="font-weight:700">${code(t)}</span> <span class="psub">${esc(projectName(t.projectId))}</span></span></td>` : ''}
      ${compact ? '' : `<td><span class="chip ${t.type}">${t.type === 'in' ? 'Thu' : 'Chi'}</span></td>`}
      <td><div style="font-weight:600">${esc(t.category)}</div>${by(t)}</td><td class="psub" style="max-width:300px;overflow-wrap:anywhere">${esc(t.note)}</td>
      <td class="r num ${t.type === 'in' ? 'c-rev' : ''}" style="font-weight:800">${amt(t)}</td>
      ${S.canWrite ? `<td><div class="actions"><button class="btn sm" data-act="edit-tx" data-id="${esc(t.id)}">Sửa</button><button class="btn sm danger" data-act="del-tx" data-id="${esc(t.id)}">Xóa</button></div></td>` : ''}
    </tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="${(showProject ? 5 : 4) - (compact ? 1 : 0)}">Tổng cộng: thu <span class="num c-rev">${vnd(st.rev)}</span> · chi <span class="num c-exp">${vnd(st.exp)}</span></td><td class="r num ${st.profit < 0 ? 'c-bad' : ''}">${total}</td>${S.canWrite ? '<td></td>' : ''}</tr></tfoot>
  </table></div>
  <ul class="txlist">${shown.map(t => {
    const inner = `<span class="l"><b>${esc(t.category)}</b><span class="psub">${fmtDate(t.date)}${showProject ? ` · ${code(t)}` : ''}${t.note ? ` · ${esc(t.note)}` : ''}${t.createdByName ? ` · Nhập: ${esc(t.createdByName)}` : ''}</span></span><span class="amt num ${t.type === 'in' ? 'c-rev' : ''}">${amt(t)}</span>`;
    return `<li>${S.canWrite ? `<button class="txrow" data-act="edit-tx" data-id="${esc(t.id)}">${inner}</button>` : `<div class="txrow">${inner}</div>`}</li>`;
  }).join('')}
    <li class="txtotal"><div class="txrow"><span class="l"><b>Tổng cộng</b><span class="psub">Thu <span class="num c-rev">${vnd(st.rev)}</span> · Chi <span class="num c-exp">${vnd(st.exp)}</span></span></span>
      <span class="amt num ${st.profit < 0 ? 'c-bad' : ''}">${total}<small>Chênh lệch (₫)</small></span></div></li></ul>`;
}

/* ---------- chart ---------- */
function niceStep(span) {
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => drawChart(el, chartData[el.dataset.chart] || []));
}
// Cột doanh thu / chi phí theo tháng + đường lợi nhuận (lũy kế hoặc từng tháng); rê chuột tô sáng cả tháng
function drawChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty" style="min-height:260px;justify-content:center">Chưa có giao dịch trong kỳ này.</div>`; return; }
  const cumMode = S.chartMode === 'cum';
  let run = 0; const rows = data.map(d => ({...d, cum: (run += d.profit)}));
  const line = d => cumMode ? d.cum : d.profit;
  const hi = Math.max(1, ...rows.map(d => Math.max(d.rev, d.exp, line(d)))), lo = Math.min(0, ...rows.map(line));
  const step = niceStep(hi - lo), top = Math.ceil(hi / step) * step, bot = Math.floor(lo / step) * step;
  // Trục tung theo tỷ đồng: đủ số lẻ để các mốc không bị làm tròn trùng nhau; lề trái nới theo nhãn dài nhất
  let dg = 0; while (dg < 6 && Math.abs(Math.round(step / 1e9 * 10 ** dg) - step / 1e9 * 10 ** dg) > 1e-6) dg++;
  const axis = v => v ? short(v, dg) : '0';
  const W = Math.max(280, el.clientWidth), H = 300, R = 18, T = 22, B = 34, L = Math.max(56, 14 + 6.6 * Math.max(axis(top).length, axis(bot).length));
  const y = v => T + (top - v) / (top - bot) * (H - T - B), y0 = y(0);
  const n = rows.length, band = (W - L - R) / n, bw = Math.max(3, Math.min(22, band * 0.3)), gap = Math.max(1.5, Math.min(4, band * 0.05));
  const cx = i => L + band * i + band / 2;
  const every = Math.ceil(n / Math.max(1, Math.floor((W - L - R) / 44)));
  const nowM = today().slice(0, 7);
  const bar = (x, v, fill) => {
    const h = y0 - y(v); if (h < 0.5) return '';
    const r = Math.min(4, bw / 2, h), t = y(v);
    return `<path d="M${x},${y0} V${t + r} Q${x},${t} ${x + r},${t} H${x + bw - r} Q${x + bw},${t} ${x + bw},${t + r} V${y0} Z" fill="${fill}"/>`;
  };
  let g = `<rect class="hl" x="0" y="${T - 8}" width="${band}" height="${H - T - B + 8}" rx="8" fill="var(--sunk)" opacity="0"/>`;
  for (let v = bot; v <= top + step / 2; v += step)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v) < step / 1e6 ? 'stroke-width="1.5"' : 'stroke-dasharray="3 5"'}/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${axis(v)}</text>`;
  const pts = rows.map((d, i) => [cx(i), y(line(d))]);
  if (cumMode && n > 1) g += `<path d="M${pts[0][0]},${y0} L${pts.map(p => p.join(',')).join(' L')} L${pts[n - 1][0]},${y0} Z" fill="var(--pro)" opacity=".07"/>`;
  rows.forEach((d, i) => {
    g += bar(cx(i) - bw - gap / 2, d.rev, 'var(--rev)') + bar(cx(i) + gap / 2, d.exp, 'var(--exp)');
    const cur = d.m === nowM;
    if (i % every === 0 || cur) {
      const [yy, mm] = d.m.split('-'); const lab = MONTHS[+mm - 1] + (i === 0 || mm === '01' ? '/' + yy.slice(2) : '');
      g += `<text x="${cx(i)}" y="${H - 12}" text-anchor="middle"${cur ? ' style="fill:var(--ink);font-weight:800"' : ''}>${lab}</text>`;
    }
  });
  g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--pro)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  rows.forEach((d, i) => { const last = i === n - 1;
    g += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${last ? 5 : 3}" fill="${line(d) < 0 ? 'var(--bad-fill)' : 'var(--pro)'}" stroke="var(--surface)" stroke-width="${last ? 2.5 : 1.5}"/>`; });
  const lv = line(rows[n - 1]), ly = Math.max(T + 4, pts[n - 1][1] - 12);
  g += `<text x="${Math.min(pts[n - 1][0] + 8, W - 2)}" y="${ly}" text-anchor="end" style="fill:${lv < 0 ? 'var(--bad)' : 'var(--pro)'};font-weight:800;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round">${short(lv)}</text>`;
  rows.forEach((d, i) => g += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T - 8}" width="${band}" height="${H - T - B + 8}" fill="transparent"/>`);
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Doanh thu, chi phí theo tháng và ${cumMode ? 'lợi nhuận lũy kế' : 'lợi nhuận từng tháng'}">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip'), hl = el.querySelector('.hl');
  el.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointerenter', () => {
      const i = +r.dataset.i, d = rows[i], [yy, mm] = d.m.split('-');
      hl.setAttribute('x', L + band * i); hl.setAttribute('opacity', '1');
      tip.innerHTML = `<b>Tháng ${+mm}/${yy}</b><br>Doanh thu <span class="num">${short(d.rev)}</span><br>Chi phí <span class="num">${short(d.exp)}</span><br>Lợi nhuận tháng <span class="num">${short(d.profit)}</span><br>Lũy kế <span class="num">${short(d.cum)}</span>`;
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(cx(i), 90), W - 90) + 'px'; tip.style.top = Math.max(96, Math.min(y(d.rev), y(d.exp), y(line(d))) - 8) + 'px';
    });
    r.addEventListener('pointerleave', () => { tip.hidden = true; hl.setAttribute('opacity', '0'); });
  });
}

// Hộp nhập mã xóa dùng chung cho mọi thao tác xóa. Mở trong <dialog> riêng nên không làm mất hộp đang mở bên dưới.
// run(code) gửi yêu cầu xóa; lỗi (sai mã, còn dữ liệu liên quan…) báo ngay trong hộp để nhập lại. Trả true khi đã xóa, false khi Hủy.
const cdlg = $('#dlg-code'), cform = $('#code-form');
function askPasscode({title, detail, confirmLabel = 'Xóa', run}) {
  return new Promise(resolve => {
    let done = false;
    cform.innerHTML = `<h2>${esc(title)}</h2>
      <p style="margin:0;font-size:13.5px;font-weight:600">${esc(detail)}</p>
      <p class="muted" style="margin:0;font-size:12.5px">Nhập mã xóa do quản trị viên đặt để xác nhận. Dữ liệu đã xóa không khôi phục được.</p>
      <label class="field"><span>Mã xóa</span><input type="password" id="cd-code" autocomplete="off" maxlength="12"></label>
      <div class="err" id="cd-err"></div>
      <div class="dlg-foot"><span></span><div class="inline"><button type="button" class="btn" id="cd-cancel">Hủy</button><button type="submit" class="btn danger">${esc(confirmLabel)}</button></div></div>`;
    const err = $('#cd-err');
    $('#cd-cancel').onclick = () => cdlg.close();
    cdlg.onclose = () => resolve(done);
    cform.onsubmit = async e => {
      e.preventDefault();
      const code = $('#cd-code').value;
      if (!code) { err.textContent = 'Nhập mã xóa.'; return; }
      const btn = cform.querySelector('[type=submit]'); btn.disabled = true;
      try { await run(code); done = true; cdlg.close(); }
      catch (er) {
        const msg = failMsg(er);
        err.textContent = msg;
        // Chưa đặt mã: chỉ dẫn; quản trị viên có nút mở thẳng phần đặt mã
        if (/chưa đặt mã xóa/i.test(msg)) {
          err.textContent = 'Quản trị viên chưa đặt mã xóa. Vào Quản lý tài khoản → Mã xóa dữ liệu.';
          if (S.me?.role === 'admin') {
            const go = document.createElement('button'); go.type = 'button'; go.className = 'btn sm'; go.style.marginLeft = '8px'; go.textContent = 'Đặt mã xóa';
            go.onclick = () => { cdlg.close(); openUsers(null, 'passcode'); };
            err.appendChild(go);
          }
        } else $('#cd-code').select();
      }
      finally { btn.disabled = false; }
    };
    cdlg.showModal(); $('#cd-code').focus();
  });
}

async function exportCsv() {
  const rows = journalRows().sort((a, b) => a.date.localeCompare(b.date));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const st = sum(rows);
  const csv = '﻿' + ['Ngày,Mã dự án,Tên dự án,Loại,Hạng mục,Diễn giải,Số tiền (VND)',
    ...rows.map(t => { const p = S.projects.find(x => x.id === t.projectId) || {}; return [t.date, p.code, p.name, t.type === 'in' ? 'Thu' : 'Chi', t.category, t.note, (t.type === 'in' ? 1 : -1) * t.amount].map(q).join(','); }),
    // Dòng Tổng cộng: cột Số tiền là chênh lệch thu − chi
    ['Tổng cộng', '', '', '', '', `Tổng thu ${vnd(st.rev)} · Tổng chi ${vnd(st.exp)} · Chênh lệch thu − chi`, st.profit].map(q).join(',')].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `so-giao-dich-${periodLabel().replace(/[^\p{L}\d]+/gu, '-').toLowerCase()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Đã xuất CSV');
}
