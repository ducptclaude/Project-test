<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Tài Chính Dự Án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger workspace — header + period bar, three views (portfolio / project / journal), numbers right-aligned in mono */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#14202B; --muted:#5A6A78; --line:#D9E0E6;
  --accent:#2B4C9B; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --rev:#1C7F55; --rev-soft:#DDF1E7; --exp:#B9542A; --exp-soft:#F7E4DA;
  --warn:#A86A10; --warn-soft:#F8EDD3; --bad:#B8322C; --bad-soft:#F8DEDC;
  --display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#151E25; --sunk:#1B262E; --ink:#E5ECF1; --muted:#93A2AE; --line:#26343E;
  --accent:#8CA6EE; --accent-ink:#0E1418; --accent-soft:#1E2A47;
  --rev:#55C690; --rev-soft:#163226; --exp:#EE8D61; --exp-soft:#3A2419;
  --warn:#E2B04E; --warn-soft:#352A12; --bad:#F07068; --bad-soft:#3D1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#151E25; --sunk:#1B262E; --ink:#E5ECF1; --muted:#93A2AE; --line:#26343E;
  --accent:#8CA6EE; --accent-ink:#0E1418; --accent-soft:#1E2A47;
  --rev:#55C690; --rev-soft:#163226; --exp:#EE8D61; --exp-soft:#3A2419;
  --warn:#E2B04E; --warn-soft:#352A12; --bad:#F07068; --bad-soft:#3D1C1A; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--num);font-weight:500;font-size:13px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:9px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar .grow{flex:1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
select,input[type=text],input[type=date],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:36px;max-width:100%}
.inline{display:flex;align-items:center;gap:8px}
.inline label{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px}
.notice.warn{background:var(--warn-soft)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--num);font-size:22px;font-weight:500;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--muted);font-family:var(--num)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.c-rev{color:var(--rev)} .c-exp{color:var(--exp)} .c-pro{color:var(--accent)} .c-bad{color:var(--bad)}
.bg-rev{background:var(--rev)} .bg-exp{background:var(--exp)} .bg-pro{background:var(--accent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.active{background:var(--accent-soft);color:var(--accent)}
.chip.done{background:var(--rev-soft);color:var(--rev)}
.chip.paused{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.code{font-family:var(--num);background:transparent;border:1px solid var(--line);color:var(--ink)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
tbody tr.link{cursor:pointer}
tbody tr.link:hover{background:var(--sunk)}
.pname{font-weight:600}
.psub{font-size:12px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:70px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)} .meter.rev>i{background:var(--rev)}
.tag-in{color:var(--rev);font-weight:500} .tag-out{color:var(--exp);font-weight:500}
.actions{display:flex;gap:6px;justify-content:flex-end}

/* chart */
.chart{position:relative;width:100%;min-height:260px}
.chart svg{display:block}
.chart text{font-family:var(--num);font-size:10.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:7px;padding:8px 10px;font-size:12px;line-height:1.55;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{font-family:var(--body)}
.tip .num{display:inline-block;min-width:90px;text-align:right}

/* category bars */
.cats{display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) 118px;gap:10px;align-items:center;font-size:13px}
.cat .meter{height:10px}
.cat .v{font-family:var(--num);font-size:12.5px;text-align:right;white-space:nowrap}
.cat .v small{color:var(--muted);margin-left:6px}

/* project view */
.pv{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.pv{grid-template-columns:minmax(0,1fr)}}
.plist{display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.plist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.plist .pitem{min-width:200px}}
.pitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .row{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.phead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan .item{display:flex;flex-direction:column;gap:6px;min-width:0}
.plan .line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.plan .big{font-family:var(--num);font-size:17px;font-weight:500}

.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.form input,.form select{width:100%}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+label.in{background:var(--rev-soft);color:var(--rev)}
.seg input:checked+label.out{background:var(--exp-soft);color:var(--exp)}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.dlg-foot .inline{margin-left:auto}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.envbar{background:repeating-linear-gradient(-45deg,var(--warn) 0 14px,#8a560c 14px 28px);color:#fff;font-weight:600;font-size:12.5px;letter-spacing:.04em;text-align:center;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.userbox{position:relative}
.userbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;min-height:36px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.userbtn .who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.userbtn .who small{color:var(--muted);font-size:11px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);padding:6px;min-width:220px;z-index:5;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog.wide{width:min(860px,calc(100vw - 32px))}
.secret{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--rev-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.secret code{font-family:var(--num);font-size:15px;font-weight:500;background:var(--surface);padding:3px 8px;border-radius:5px;user-select:all}
.role-viewer{background:var(--sunk);color:var(--muted)} .role-editor{background:var(--accent-soft);color:var(--accent)} .role-admin{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.pitem{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>
</head>
<body>

<div id="envbar" class="envbar" hidden></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">₫</div>
      <div><h1>Sổ Tài Chính Dự Án</h1><p>Doanh thu · Chi phí · Lợi nhuận theo từng dự án và toàn danh mục</p></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview" id="tab-overview">Tổng quan</button>
      <button class="tab" role="tab" data-view="project" id="tab-project">Dự án</button>
      <button class="tab" role="tab" data-view="journal" id="tab-journal">Sổ giao dịch</button>
    </nav>
    <div class="userbox" id="userbox" hidden>
      <button class="userbtn" id="userbtn" aria-haspopup="menu" aria-expanded="false"><span class="avatar" id="u-avatar"></span><span class="who"><b id="u-name"></b><small id="u-role"></small></span></button>
      <div class="menu" id="usermenu" role="menu" hidden>
        <button role="menuitem" id="m-password">Đổi mật khẩu</button>
        <button role="menuitem" id="m-users" hidden>Quản lý tài khoản</button>
        <hr>
        <button role="menuitem" id="m-logout">Đăng xuất</button>
      </div>
    </div>
  </header>

  <div id="notice"></div>

  <div class="bar">
    <div class="inline"><label for="f-year">Năm</label><select id="f-year"></select></div>
    <div class="inline"><label for="f-period">Kỳ</label><select id="f-period"></select></div>
    <span class="grow"></span>
    <button class="btn" id="btn-new-project">+ Dự án</button>
    <button class="btn primary" id="btn-new-tx">+ Giao dịch</button>
  </div>

  <main id="main"><div class="panel empty">Đang tải dữ liệu…</div></main>
</div>

<dialog id="dlg"><form class="dlg" id="dlg-form" novalidate></form></dialog>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd = v => Math.round(v || 0).toLocaleString('vi-VN') + ' ₫';
const short = v => {
  const a = Math.abs(v || 0), f = (x, d) => x.toLocaleString('vi-VN', {maximumFractionDigits: d});
  if (a >= 1e9) return f(v / 1e9, 2) + ' tỷ';
  if (a >= 1e6) return f(v / 1e6, 1) + ' tr';
  if (a >= 1e3) return f(v / 1e3, 0) + ' nghìn';
  return f(v || 0, 0);
};
const pct = v => isFinite(v) ? (v * 100).toLocaleString('vi-VN', {maximumFractionDigits: 1}) + '%' : '—';
const parseMoney = s => Number(String(s).replace(/[^\d]/g, '')) || 0;
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
const today = () => new Date().toISOString().slice(0, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem('stc:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('stc:' + k, JSON.stringify(v)); } catch {} }
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600);
}
function armButton(btn, label, action) {
  // two-step confirmation: first click arms, second click acts
  if (btn.classList.contains('armed')) { action(); return; }
  const orig = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = orig; } }, 3500);
}

const STATUS = {active: 'Đang thực hiện', paused: 'Tạm dừng', done: 'Hoàn thành'};
const CATS = {
  in: ['Tạm ứng hợp đồng', 'Thanh toán theo nghiệm thu', 'Quyết toán', 'Phát sinh ngoài hợp đồng', 'Dịch vụ / bảo trì', 'Thu khác'],
  out: ['Nhân công', 'Vật tư', 'Thiết bị / máy móc', 'Thầu phụ', 'Vận chuyển', 'Bản quyền / phần mềm', 'Chi phí quản lý', 'Thuế & phí', 'Chi khác']
};
const MONTHS = ['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];

/* ---------- state ---------- */
const S = {
  mode: 'loading', projects: [], txs: [], canWrite: false, me: null,
  view: store.get('view', 'overview'), projectId: store.get('project', null),
  year: store.get('year', String(new Date().getFullYear())), period: store.get('period', 'all'),
  jf: {project: '', type: '', q: ''}
};


/* ---------- data layer ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
async function retry(fn) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      if (i < 3 && (e?.code === 'unavailable' || e?.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 400 * (i + 1) + Math.random() * 300)); continue; }
      throw e;
    }
  }
}
function failMsg(e) {
  if (e?.message) return e.message;
  if (e?.code === 'quota_exceeded') return 'Cơ sở dữ liệu đã đầy. Hãy xóa bớt giao dịch cũ rồi thử lại.';
  if (e?.code === 'invalid_argument') return 'Dữ liệu không hợp lệ, chưa lưu được.';
  return 'Chưa lưu được. Kiểm tra kết nối rồi thử lại.';
}
async function api(method, path, body) {
  const headers = {'X-Requested-With': 'fetch'}; if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch('api/' + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { location.replace('login'); throw {code: 'unauthenticated', message: 'Phiên đăng nhập đã hết hạn.'}; }
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw {code: r.status === 413 ? 'quota_exceeded' : r.status >= 500 ? 'unavailable' : r.status === 403 ? 'forbidden' : 'invalid_argument', message: d.error};
  }
  return r.status === 204 || r.status === 201 ? null : r.json();
}
async function put(col, id, data) {
  await retry(() => api('PUT', col + '/' + encodeURIComponent(id), data));
  const list = col === 'projects' ? S.projects : S.txs, i = list.findIndex(x => x.id === id);
  if (i >= 0) list[i] = {id, ...data}; else list.push({id, ...data});
  render();
}
async function del(col, id) {
  await retry(() => api('DELETE', col + '/' + encodeURIComponent(id)));
  if (col === 'projects') S.projects = S.projects.filter(x => x.id !== id); else S.txs = S.txs.filter(x => x.id !== id);
  render();
}
const strip = o => { const {id, ...rest} = o; return rest; };

/* ---------- derived numbers ---------- */
function range() {
  if (S.year === 'all') return [null, null];
  const y = S.year, p = S.period;
  if (p === 'all') return [`${y}-01-01`, `${y}-12-31`];
  if (p[0] === 'q') { const q = +p[1], a = (q - 1) * 3 + 1, b = a + 2; return [`${y}-${String(a).padStart(2,'0')}-01`, `${y}-${String(b).padStart(2,'0')}-31`]; }
  const m = p.slice(1); return [`${y}-${m}-01`, `${y}-${m}-31`];
}
function periodLabel() {
  if (S.year === 'all') return 'Toàn thời gian';
  if (S.period === 'all') return 'Năm ' + S.year;
  if (S.period[0] === 'q') return `Quý ${S.period[1]}/${S.year}`;
  return `Tháng ${+S.period.slice(1)}/${S.year}`;
}
const inRange = t => { const [a, b] = range(); return (!a || t.date >= a) && (!b || t.date <= b); };
function sum(txs) {
  let rev = 0, exp = 0; const cat = {in: {}, out: {}};
  for (const t of txs) {
    const a = +t.amount || 0;
    if (t.type === 'in') rev += a; else exp += a;
    cat[t.type][t.category || 'Khác'] = (cat[t.type][t.category || 'Khác'] || 0) + a;
  }
  return {rev, exp, profit: rev - exp, margin: rev ? (rev - exp) / rev : NaN, cat};
}
function monthly(txs) {
  let [a, b] = range();
  if (!a) {
    if (!txs.length) return [];
    const ds = txs.map(t => t.date).sort(); a = ds[0]; b = ds[ds.length - 1];
  }
  const out = [], idx = {};
  let [y, m] = a.slice(0, 7).split('-').map(Number); let end = b.slice(0, 7);
  const lastTx = txs.reduce((mx, t) => t.date > mx ? t.date : mx, '').slice(0, 7), now = today().slice(0, 7);
  if (end > now) end = lastTx > now ? lastTx : now;
  while (true) {
    const k = `${y}-${String(m).padStart(2, '0')}`; if (k > end) break;
    idx[k] = out.length; out.push({m: k, rev: 0, exp: 0, profit: 0});
    if (++m > 12) { m = 1; y++; }
  }
  for (const t of txs) { const o = out[idx[t.date.slice(0, 7)]]; if (!o) continue; if (t.type === 'in') o.rev += +t.amount; else o.exp += +t.amount; }
  out.forEach(o => o.profit = o.rev - o.exp);
  return out;
}
const projTxs = id => S.txs.filter(t => t.projectId === id);
function health(p) {
  const all = sum(projTxs(p.id)), used = p.budget ? all.exp / p.budget : 0, flags = [];
  if (all.profit < 0 && all.exp > 0) flags.push(['bad', 'Đang lỗ']);
  if (used > 1) flags.push(['bad', 'Vượt ngân sách']); else if (used > 0.9) flags.push(['warn', 'Gần chạm ngân sách']);
  return {all, used, flags};
}
const meterCls = u => u > 1 ? 'bad' : u > 0.9 ? 'warn' : '';
const statusChip = s => `<span class="chip ${esc(s)}">${STATUS[s] || esc(s)}</span>`;
const projectName = id => S.projects.find(p => p.id === id)?.name || 'Dự án đã xóa';
const sortedProjects = () => [...S.projects].sort((a, b) => (a.code || '').localeCompare(b.code || '', 'vi'));

/* ---------- chart ---------- */
function niceStep(span) {
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function drawCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => drawChart(el, chartData[el.dataset.chart] || []));
}
function drawChart(el, data) {
  if (!data.length) { el.innerHTML = `<div class="empty" style="min-height:240px;justify-content:center">Chưa có giao dịch trong kỳ này.</div>`; return; }
  const W = Math.max(300, el.clientWidth), H = 260, L = 58, R = 10, T = 14, B = 30;
  const hi = Math.max(1, ...data.map(d => Math.max(d.rev, d.exp, d.profit))), lo = Math.min(0, ...data.map(d => d.profit));
  const step = niceStep(hi - lo), top = Math.ceil(hi / step) * step, bot = Math.floor(lo / step) * step;
  const y = v => T + (top - v) / (top - bot) * (H - T - B);
  const band = (W - L - R) / data.length, bw = Math.max(2, Math.min(16, band * 0.3));
  const cx = i => L + band * i + band / 2;
  const every = Math.ceil(data.length / Math.max(1, Math.floor((W - L - R) / 42)));
  let g = '';
  for (let v = bot; v <= top + step / 2; v += step)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="1.5"' : 'stroke-dasharray="2 4"'}/><text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end">${short(v)}</text>`;
  data.forEach((d, i) => {
    g += `<rect x="${cx(i) - bw - 1}" y="${y(d.rev)}" width="${bw}" height="${Math.max(0, y(0) - y(d.rev))}" rx="2" fill="var(--rev)"/>`;
    g += `<rect x="${cx(i) + 1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0, y(0) - y(d.exp))}" rx="2" fill="var(--exp)"/>`;
    if (i % every === 0) {
      const [yy, mm] = d.m.split('-'); const lab = MONTHS[+mm - 1] + (i === 0 || mm === '01' ? '/' + yy.slice(2) : '');
      g += `<text x="${cx(i)}" y="${H - 10}" text-anchor="middle">${lab}</text>`;
    }
  });
  const pts = data.map((d, i) => `${cx(i)},${y(d.profit)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  data.forEach((d, i) => g += `<circle cx="${cx(i)}" cy="${y(d.profit)}" r="${i === data.length - 1 ? 4.5 : 3}" fill="${d.profit < 0 ? 'var(--bad)' : 'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"/>`);
  data.forEach((d, i) => g += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent"/>`);
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh thu, chi phí và lợi nhuận theo tháng">${g}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  el.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('pointerenter', () => {
      const d = data[+r.dataset.i], [yy, mm] = d.m.split('-');

async function exportCsv() {
  const rows = journalRows().sort((a, b) => a.date.localeCompare(b.date));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + ['Ngày,Mã dự án,Tên dự án,Loại,Hạng mục,Diễn giải,Số tiền (VND)',
    ...rows.map(t => { const p = S.projects.find(x => x.id === t.projectId) || {}; return [t.date, p.code, p.name, t.type === 'in' ? 'Thu' : 'Chi', t.category, t.note, (t.type === 'in' ? 1 : -1) * t.amount].map(q).join(','); })].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `so-giao-dich-${periodLabel().replace(/[^\p{L}\d]+/gu, '-').toLowerCase()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Đã xuất CSV');
}

fetch('api/info').then(r => r.json()).then(({env}) => {
  if (!env || env === 'production') return;
  const b = $('#envbar'); b.textContent = `MÔI TRƯỜNG THỬ NGHIỆM (${env}) · dữ liệu ở đây tách biệt với hệ thống chính`; b.hidden = false;
  document.title = `[${env}] ` + document.title;
}).catch(() => {});
setInterval(() => { if (!document.hidden) load(false); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
</script>
</body>
</html>
