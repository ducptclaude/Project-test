    if (a === 'new-contract') openContract(null, id, act.dataset.kind);
    if (a === 'edit-contract') openContract(S.contracts.find(c => c.id === id));
    if (a === 'del-contract') openDeleteContract(S.contracts.find(c => c.id === id));
    if (a === 'journal-of') { S.jf = {project: id, type: '', q: ''}; S.jpage = 0; S.view = 'journal'; store.set('view', S.view); render(); window.scrollTo({top: 0}); }
    if (a === 'del-tx') deleteTx(S.txs.find(t => t.id === id));
    return;
  }
  const cm = e.target.closest('[data-cmode]'), mx = e.target.closest('[data-mix]');
  if (cm) { S.chartMode = cm.dataset.cmode; store.set('chartMode', S.chartMode); render(); return; }
  if (mx) { S.mix = mx.dataset.mix; store.set('mix', S.mix); render(); return; }
  const pg = e.target.closest('[data-page]');
  if (pg && !pg.disabled) { S.jpage = +pg.dataset.page; renderJournalTable(); $('#j-table').scrollIntoView({block: 'start'}); return; }
  if (open || pick) { S.projectId = (open || pick).dataset.open || (open || pick).dataset.pick; store.set('project', S.projectId); S.view = 'project'; render(); window.scrollTo({top: 0}); }
});
$('#main').addEventListener('submit', e => { const f = e.target.closest('form[data-entry]'); if (f) { e.preventDefault(); saveEntry(f); } });
$('#main').addEventListener('input', e => {
  if (e.target.matches('[data-money]')) {
    const inp = e.target, n = parseMoney(inp.value); inp.value = n ? n.toLocaleString('vi-VN') : '';
    const hint = $(`[data-hint="${inp.id}"]`); if (hint) hint.textContent = n ? spoken(n) : '';
  }
  if (e.target.id === 'j-q') { S.jf.q = e.target.value; S.jpage = 0; renderJournalTable(); }
});
$('#main').addEventListener('change', e => {
  if (e.target.id === 'j-project') { S.jf.project = e.target.value; S.jpage = 0; renderJournalTable(); }
  if (e.target.id === 'j-type') { S.jf.type = e.target.value; S.jpage = 0; renderJournalTable(); }
  if (e.target.id === 'p-sort') { S.psort = e.target.value; store.set('psort', S.psort); render(); }
});
$('#main').addEventListener('click', e => {
  if (e.target.id === 'j-export') exportCsv();
  const go = e.target.closest('[data-view-go]');
  if (go) { S.view = go.dataset.viewGo; store.set('view', S.view); render(); window.scrollTo({top: 0}); }
});
// Nhớ dự án và ngày đang chọn trong từng ô nhập liệu
$('#main').addEventListener('change', e => {
  const f = e.target.closest('form[data-entry]'); if (!f) return;
  const t = f.dataset.entry;
  if (e.target.id === `e-${t}-project`) S.entry[t].projectId = e.target.value;
  if (e.target.id === `e-${t}-date`) S.entry[t].date = e.target.value;
});

// Nút chọn nhanh hạng mục (ô nhập ở trang Doanh thu/Chi phí và hộp Ghi / Sửa giao dịch): [data-qcats] mang tiền tố id của nhóm trường
document.addEventListener('click', e => {
  const q = e.target.closest('[data-qcat]'); if (!q) return;
  const box = q.closest('[data-qcats]'), px = box.dataset.qcats;
  document.getElementById(px + 'cat').value = q.dataset.qcat;
  box.querySelectorAll('.qcat').forEach(b => b.setAttribute('aria-pressed', String(b === q)));
  document.getElementById(px + 'amount').focus();
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.matches('input[list]') || !el.id.endsWith('cat')) return;
  const box = document.querySelector(`[data-qcats="${el.id.slice(0, -3)}"]`);
  if (box) box.querySelectorAll('.qcat').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.qcat === el.value)));
});

/* ---------- boot ---------- */
render();
async function load(first) {
  try {
    const d = await api('GET', 'data', null, !first);
    const cts = d.contracts || [];
    const same = JSON.stringify(d.projects) === JSON.stringify(S.projects) && JSON.stringify(d.transactions) === JSON.stringify(S.txs) && JSON.stringify(cts) === JSON.stringify(S.contracts);
    S.projects = d.projects; S.txs = d.transactions.filter(t => t.date); S.contracts = cts; S.mode = 'db';
    if (first || !same) { if (dlg.open) return; refresh(); }
  } catch (e) {
    if (first) $('#main').innerHTML = `<div class="panel empty">Không kết nối được máy chủ. Tải lại trang để thử lại.</div>`;
  }
}
/* ---------- tài khoản ---------- */
const ROLE_NAMES = {viewer: 'Chỉ xem', editor: 'Nhập liệu', admin: 'Quản trị'};
function renderUser() {
  const u = S.me; if (!u) return;
  $('#userbox').hidden = false;
  $('#u-name').textContent = u.name; $('#u-role').textContent = ROLE_NAMES[u.role] || u.role;
  $('#u-avatar').textContent = u.name.split(/\s+/).filter(Boolean).slice(-2).map(w => w[0]).join('').toUpperCase();
  $('#m-users').hidden = u.role !== 'admin';
}
const menu = $('#usermenu');
const toggleMenu = open => { menu.hidden = !open; $('#userbtn').setAttribute('aria-expanded', open); };
$('#userbtn').onclick = e => { e.stopPropagation(); toggleMenu(menu.hidden); };
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) toggleMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
$('#m-logout').onclick = async () => { try { await api('POST', 'logout'); } catch {} location.replace('login'); };
$('#m-password').onclick = () => { toggleMenu(false); openPassword(false); };
$('#m-users').onclick = () => { toggleMenu(false); openUsers(); };
const genPassword = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789', a = crypto.getRandomValues(new Uint32Array(10)); return [...a].map(n => c[n % c.length]).join(''); };
async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); btn.textContent = 'Đã chép'; } catch { const r = document.createRange(); r.selectNodeContents(btn.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); }
}

function openPassword(forced) {
  dlg.classList.remove('wide');
  form.innerHTML = `<h2>${forced ? 'Đặt mật khẩu mới' : 'Đổi mật khẩu'}</h2>
    ${forced ? '<p class="muted" style="margin:0">Bạn đang dùng mật khẩu tạm do quản trị viên cấp. Hãy đặt mật khẩu riêng trước khi tiếp tục.</p>' : ''}
    <div class="form">
      <label class="field full"><span>Mật khẩu hiện tại</span><input type="password" id="pw-cur" autocomplete="current-password"></label>
      <label class="field"><span>Mật khẩu mới</span><input type="password" id="pw-new" autocomplete="new-password" placeholder="Ít nhất 8 ký tự"></label>
      <label class="field"><span>Nhập lại mật khẩu mới</span><input type="password" id="pw-new2" autocomplete="new-password"></label>
    </div>
    <div class="err" id="pw-err"></div>
    <div class="dlg-foot"><span></span><div class="inline">${forced ? '' : '<button type="button" class="btn" id="pw-cancel">Hủy</button>'}<button type="submit" class="btn primary">Lưu mật khẩu</button></div></div>`;
  if (!forced) $('#pw-cancel').onclick = () => dlg.close();
  dlg.oncancel = forced ? e => e.preventDefault() : null;
  form.onsubmit = async e => {
    e.preventDefault();
    const cur = $('#pw-cur').value, nx = $('#pw-new').value;
    if (nx.length < 8) return $('#pw-err').textContent = 'Mật khẩu mới cần ít nhất 8 ký tự.';
    if (nx !== $('#pw-new2').value) return $('#pw-err').textContent = 'Hai lần nhập mật khẩu mới chưa khớp.';
    if (nx === cur) return $('#pw-err').textContent = 'Mật khẩu mới phải khác mật khẩu hiện tại.';
    try { await api('POST', 'me/password', {current: cur, next: nx}); S.me.mustChange = false; dlg.oncancel = null; dlg.close(); toast('Đã đổi mật khẩu'); }
    catch (er) { $('#pw-err').textContent = er.message || 'Chưa đổi được mật khẩu.'; }
  };
  dlg.showModal(); $('#pw-cur').focus();
}

async function openUsers(note, focus) {
  dlg.classList.add('wide'); dlg.oncancel = null;
  let users = [], dp = {};
  try { [users, dp] = await Promise.all([api('GET', 'users'), api('GET', 'delete-passcode')]); } catch (er) { toast(failMsg(er)); return; }
  const roleSel = (id, v, dis) => `<select data-role="${esc(id)}" ${dis ? 'disabled' : ''} aria-label="Vai trò">${Object.entries(ROLE_NAMES).map(([k, n]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  form.innerHTML = `<div class="panel-head"><h2>Quản lý tài khoản</h2><button type="button" class="btn sm" id="us-close">Đóng</button></div>
    ${note ? `<div class="secret">${note}</div>` : ''}
    <div class="tbl-wrap" style="margin:0"><table>
      <thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th></th></tr></thead>
      <tbody>${users.map(u => { const me = u.username === S.me.username; return `<tr>
        <td><div class="pname">${esc(u.name)}${me ? ' <span class="chip">Bạn</span>' : ''}</div><div class="psub num">${esc(u.username)}</div></td>
        <td>${roleSel(u.username, u.role, me)}</td>
        <td>${u.active ? (u.mustChange ? '<span class="chip warn">Chờ đổi mật khẩu</span>' : '<span class="chip done">Đang hoạt động</span>') : '<span class="chip bad">Đã khóa</span>'}</td>
        <td class="psub num">${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('vi-VN') : 'Chưa đăng nhập'}</td>
        <td><div class="actions">${me ? '' : `<button type="button" class="btn sm" data-reset="${esc(u.username)}">Cấp lại mật khẩu</button>
          <button type="button" class="btn sm" data-active="${esc(u.username)}" data-v="${u.active ? 0 : 1}">${u.active ? 'Khóa' : 'Mở khóa'}</button>
          <button type="button" class="btn sm danger" data-del="${esc(u.username)}">Xóa</button>`}</div></td>
      </tr>`; }).join('')}</tbody>
    </table></div>
    <h3>Thêm tài khoản</h3>
    <div class="form" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <label class="field"><span>Tên đăng nhập</span><input type="text" id="nu-user" autocomplete="off" autocapitalize="none" placeholder="vd: nguyen.van.a"></label>
      <label class="field"><span>Họ tên</span><input type="text" id="nu-name" autocomplete="off"></label>
      <label class="field"><span>Vai trò</span><select id="nu-role">${Object.entries(ROLE_NAMES).map(([k, n]) => `<option value="${k}" ${k === 'editor' ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="field"><span>Mật khẩu tạm</span><input type="text" id="nu-pass" value="${genPassword()}" autocomplete="off" class="num"></label>
    </div>
    <p class="psub" style="margin:0">Chỉ xem: xem số liệu. Nhập liệu: thêm, sửa, xóa dự án và giao dịch. Quản trị: như Nhập liệu và quản lý tài khoản. Người mới phải đổi mật khẩu tạm ở lần đăng nhập đầu.</p>
    <div class="err" id="us-err"></div>
    <div class="dlg-foot"><span></span><button type="submit" class="btn primary">Tạo tài khoản</button></div>
    <h3>Mã xóa dữ liệu</h3>
    <p class="psub" style="margin:0">Nhập liệu và Quản trị phải nhập mã này mỗi khi xóa: giao dịch, dự án, hợp đồng, dữ liệu ví dụ, tài khoản. ${dp.set ? `<span class="chip done">Đã đặt</span> lần cuối ${esc(dp.updatedByName || '')} · ${dp.updatedAt ? new Date(dp.updatedAt).toLocaleString('vi-VN') : ''}` : '<span class="chip warn">Chưa đặt</span> chưa ai xóa được dữ liệu.'}</p>
    <div class="inline" style="flex-wrap:wrap"><input type="password" id="dp-new" maxlength="12" autocomplete="new-password" placeholder="4–12 ký tự" style="flex:1 1 180px"><button type="button" class="btn" id="dp-save">${dp.set ? 'Đổi mã xóa' : 'Đặt mã xóa'}</button></div>
    <div class="err" id="dp-err2"></div>`;
  const fail = er => $('#us-err').textContent = failMsg(er);
  $('#us-close').onclick = () => dlg.close();
  form.querySelectorAll('[data-role]').forEach(sel => sel.onchange = async () => {
    try { await api('PATCH', 'users/' + encodeURIComponent(sel.dataset.role), {role: sel.value}); toast('Đã đổi vai trò'); } catch (er) { fail(er); openUsers(); }
  });
  form.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => armButton(b, 'Bấm lần nữa để cấp', async () => {
    const pw = genPassword(), u = b.dataset.reset;
    try { await api('PATCH', 'users/' + encodeURIComponent(u), {password: pw}); openUsers(`Mật khẩu tạm mới của <b>${esc(u)}</b>: <code>${pw}</code><button type="button" class="btn sm" data-copy="${pw}">Chép</button><span class="psub">Gửi cho người dùng; họ sẽ phải đổi khi đăng nhập.</span>`); }
    catch (er) { fail(er); }
  }));
  form.querySelectorAll('[data-active]').forEach(b => b.onclick = async () => {
    try { await api('PATCH', 'users/' + encodeURIComponent(b.dataset.active), {active: b.dataset.v === '1'}); openUsers(); } catch (er) { fail(er); }
  });
  // Hộp mã xóa mở chồng lên Quản lý tài khoản; xóa xong mới vẽ lại danh sách
  form.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const u = users.find(x => x.username === b.dataset.del);
    const ok = await askPasscode({title: 'Xóa tài khoản', detail: `Tài khoản ${u.username} · ${u.name} (${ROLE_NAMES[u.role] || u.role})`, confirmLabel: 'Xóa tài khoản',
      run: async code => { await api('DELETE', 'users/' + encodeURIComponent(u.username), {passcode: code}); toast('Đã xóa tài khoản'); }});
    if (ok) openUsers();
  });
  form.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(b.dataset.copy, b));
  const saveDp = async () => {
    const v = $('#dp-new').value;
    if (v.length < 4 || v.length > 12) return $('#dp-err2').textContent = 'Mã xóa gồm 4–12 ký tự.';
    try { await api('PUT', 'delete-passcode', {passcode: v}); toast('Đã lưu mã xóa'); openUsers(); } catch (er) { $('#dp-err2').textContent = failMsg(er); }
  };
  $('#dp-save').onclick = saveDp;
  $('#dp-new').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); saveDp(); } };
  form.onsubmit = async e => {
    e.preventDefault();
    const body = {username: $('#nu-user').value.trim().toLowerCase(), name: $('#nu-name').value.trim(), role: $('#nu-role').value, password: $('#nu-pass').value};
    try { await api('POST', 'users', body); openUsers(`Đã tạo tài khoản <b>${esc(body.username)}</b> · mật khẩu tạm: <code>${esc(body.password)}</code><button type="button" class="btn sm" data-copy="${esc(body.password)}">Chép</button><span class="psub">Gửi cho người dùng cùng địa chỉ trang đăng nhập.</span>`); }
    catch (er) { fail(er); }
  };
  if (!dlg.open) dlg.showModal();
  if (focus === 'passcode') { $('#dp-new').scrollIntoView({block: 'center'}); $('#dp-new').focus(); }
}
dlg.addEventListener('close', () => { dlg.classList.remove('wide'); });

/* ---------- tự đăng xuất khi không hoạt động ---------- */
// Thao tác chuột, bàn phím, cuộn, chạm là hoạt động. Đang hoạt động thì cứ 5 phút gia hạn phiên ở máy chủ một lần;
// không hoạt động quá idleMinutes (mặc định 60) thì đăng xuất. Cập nhật số liệu ngầm không tính là hoạt động.
let lastAct = Date.now(), lastPing = Date.now(), idleMs = 60 * 60e3;
['pointerdown', 'keydown', 'wheel', 'touchstart', 'input'].forEach(ev => addEventListener(ev, () => lastAct = Date.now(), {passive: true, capture: true}));
async function logoutIdle() { try { await api('POST', 'logout', null, true); } catch {} location.replace('login#khong-hoat-dong'); }
setInterval(() => {
  const now = Date.now();
  if (now - lastAct >= idleMs) return logoutIdle();
  if (now - lastAct < 5 * 60e3 && now - lastPing > 5 * 60e3) api('GET', 'me').catch(() => {});
}, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastAct >= idleMs) logoutIdle(); });

(async () => {
  try { S.me = await api('GET', 'me'); } catch { return; }
  if (S.me.idleMinutes) idleMs = S.me.idleMinutes * 60e3;
  S.canWrite = S.me.role !== 'viewer';
  renderUser();
  await load(true);
  if (S.me.mustChange) openPassword(true);
})();
// Tên hiển thị lấy từ biến BRAND_*; logo thay biểu tượng khi có tệp public/brand/logo.png
fetch('api/brand').then(r => r.json()).then(b => {
  if (b.logo) { const img = new Image(); img.src = 'brand/logo.png'; img.alt = b.name; $('#logo').replaceChildren(img); }
  $('#b-name').textContent = b.name; $('#b-org').textContent = b.org || 'Quản lý tài chính dự án';
  document.title = document.title.replace('Sổ Tài Chính Dự Án', b.name);
}).catch(() => {});
// Hiện dải cảnh báo ở mọi môi trường không phải production
fetch('api/info').then(r => r.json()).then(({env}) => {
  if (!env || env === 'production') return;
  const b = $('#envbar'); b.textContent = `MÔI TRƯỜNG THỬ NGHIỆM (${env}) · dữ liệu ở đây tách biệt với hệ thống chính`; b.hidden = false;
  const envh = () => document.documentElement.style.setProperty('--envh', (innerWidth > 760 ? b.offsetHeight : 0) + 'px');
  envh(); addEventListener('resize', envh);
  document.title = `[${env}] ` + document.title;
}).catch(() => {});
setInterval(() => { if (!document.hidden) load(false); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
</script>
</body>
</html>
